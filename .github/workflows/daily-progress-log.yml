name: Archive daily progress

on:
  issues:
    types: [opened]
  schedule:
    # 18:23 Asia/Kolkata (UTC+05:30); offset to avoid the top of the hour.
    - cron: "53 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-progress-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Archive real check-ins
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const authorLogin = 'bhupathirajurishita';
          const token = process.env.GH_TOKEN;
          const apiBase = 'https://api.github.com';
          const newline = String.fromCharCode(10);

          async function api(path, options = {}) {
            const response = await fetch(apiBase + path, {
              ...options,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
                ...(options.headers || {}),
              },
            });
            const text = await response.text();
            const data = text ? JSON.parse(text) : null;
            if (!response.ok) throw new Error(`GitHub API ${response.status}: ${text}`);
            return data;
          }

          function localDate(isoDate) {
            const parts = new Intl.DateTimeFormat('en-CA', {
              timeZone: 'Asia/Kolkata',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
            }).formatToParts(new Date(isoDate));
            const values = Object.fromEntries(parts.map(({ type, value }) => [type, value]));
            return `${values.year}-${values.month}-${values.day}`;
          }

          function validCheckIn(issue) {
            if (!issue || issue.pull_request || issue.user?.login !== authorLogin) return false;
            if (!issue.title.startsWith('Daily progress:')) return false;
            const body = issue.body || '';
            const requiredHeadings = [
              'What did you work on?',
              'What changed, did you test, or learn?',
              'Evidence or result',
            ];
            for (const heading of requiredHeadings) {
              const start = body.indexOf(`### ${heading}`);
              if (start < 0) return false;
              const contentStart = start + heading.length + 4;
              const nextHeading = body.indexOf(newline + '### ', contentStart);
              const answer = body.slice(contentStart, nextHeading < 0 ? undefined : nextHeading).trim();
              const normalized = answer.toLowerCase();
              if (answer.length < 12 || ['no response', 'n/a', 'na', 'none', 'tbd', 'todo', '-'].includes(normalized)) return false;
            }
            return true;
          }

          async function closeIssue(issue) {
            if (issue.state !== 'closed') {
              await api(`/repos/${owner}/${repo}/issues/${issue.number}`, {
                method: 'PATCH',
                body: JSON.stringify({ state: 'closed', state_reason: 'completed' }),
              });
            }
          }

          async function archive(issue) {
            const date = localDate(issue.created_at);
            const path = `progress/${date}.md`;
            const marker = `<!-- archived-issue: ${issue.number} -->`;
            const current = await fetch(`${apiBase}/repos/${owner}/${repo}/contents/${path}`, {
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
              },
            });

            let oldContent = '';
            let sha;
            if (current.ok) {
              const file = await current.json();
              oldContent = Buffer.from(file.content, 'base64').toString('utf8');
              sha = file.sha;
            } else if (current.status !== 404) {
              throw new Error(`Could not read ${path}: HTTP ${current.status}`);
            }

            if (oldContent.includes(marker)) {
              console.log(`Issue #${issue.number} is already archived.`);
              await closeIssue(issue);
              return;
            }

            const entry = [
              `## [${issue.title}](https://github.com/${owner}/${repo}/issues/${issue.number})`,
              '',
              `Reported: ${issue.created_at}`,
              '',
              issue.body.trim(),
              '',
              marker,
              '',
            ].join(newline);
            const content = oldContent
              ? `${oldContent.trimEnd()}${newline}${newline}${entry}`
              : `# Progress for ${date}${newline}${newline}${entry}`;

            await api(`/repos/${owner}/${repo}/contents/${path}`, {
              method: 'PUT',
              body: JSON.stringify({
                message: `docs(progress): archive check-in #${issue.number} (${date})`,
                content: Buffer.from(content, 'utf8').toString('base64'),
                branch: 'main',
                ...(sha ? { sha } : {}),
              }),
            });
            await closeIssue(issue);
            console.log(`Archived check-in #${issue.number} to ${path}.`);
          }

          let candidates = [];
          if (process.env.GITHUB_EVENT_NAME === 'issues') {
            const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
            if (event.action === 'opened') candidates = [event.issue];
          } else {
            for (let page = 1; page <= 10; page++) {
              const batch = await api(`/repos/${owner}/${repo}/issues?state=open&per_page=100&page=${page}`);
              candidates.push(...batch.filter((item) => !item.pull_request));
              if (batch.length < 100) break;
            }
          }

          for (const issue of candidates) {
            if (validCheckIn(issue)) await archive(issue);
          }
          NODE
